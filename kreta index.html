<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahara Kreta</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#fff;padding:28px;border-radius:16px;width:360px;box-shadow:0 8px 25px rgba(0,0,0,.1)}
input{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.black{background:#000;color:#fff}
.outline{background:#fff;border:1px solid #000 !important}
.google{background:#4285F4;color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs div{flex:1;text-align:center;padding:10px;border-radius:8px;background:#eee;cursor:pointer;font-size:14px}
.tabs .active{background:#000;color:#fff}
.hide{display:none}
#msg{text-align:center;color:red;font-size:13px;margin-top:10px}
</style>
</head>
<body>

<div class="box" id="authBox">
<h2 style="text-align:center">Login</h2>

<div class="tabs">
<div id="tPhone" class="active">📱 Phone</div>
<div id="tEmail">📧 Email</div>
<div id="tGoogle">🔵 Google</div>
</div>

<div id="phoneBox">
<input id="phone" placeholder="Phone +91 98765...">
<button id="sendOtp" class="black">Send OTP</button>
<input id="otp" class="hide" placeholder="6 Digit OTP">
<button id="verifyOtp" class="hide black">Verify & Login</button>
</div>

<div id="emailBox" class="hide">
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button id="signupEmail" class="black">Sign Up with Email</button>
<button id="signinEmail" class="outline">Sign In with Email</button>
</div>

<div id="googleBox" class="hide">
<button id="googleBtn" class="google">Continue with Google</button>
</div>

<p id="msg"></p>
</div>

<div class="box hide" id="homeBox">
<h2 id="welcome"></h2>
<p id="info"></p>
<button id="logout" class="black">Log Out</button>
</div>

<script type="module" src="kreta script.js"></script>
</body>
  </html>
