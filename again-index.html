<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</head>
<body class="bg-black text-white">

  <!-- Tumhara Royal Popup - Screenshot wala -->
  <div id="royalModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
    <div class="bg-[#111] border border-yellow-500 rounded-xl p-8 w-full max-w-md shadow-2xl">
      <h1 class="text-3xl font-bold mb-1">Welcome to Royal Collection</h1>
      <p class="text-gray-400 mb-6">Sign up to explore exclusive designs</p>
      
      <div class="space-y-5">
        <input id="fullName" type="text" placeholder="Full Name" class="w-full bg-black border border-yellow-500 rounded-lg p-3 outline-none focus:border-yellow-300">
        
        <input id="contactInfo" type="text" placeholder="Mobile Number / Email" class="w-full bg-black border border-yellow-500 rounded-lg p-3 outline-none focus:border-yellow-300">
        
        <button id="createRoyalBtn" class="bg-[#D4AF37] text-black font-bold px-6 py-3 rounded-lg w-auto hover:bg-yellow-400 transition">
          Create Royal Account
        </button>
        <p id="statusMsg" class="text-sm text-gray-400 mt-2"></p>
      </div>
    </div>
  </div>

  <!-- Tumhari main website ka content yahan aayega -->
  <div class="p-10 text-center">Your Jewellery Website Content Here...</div>

  <script src="again-script.js"></script>
</body>
  </html>
